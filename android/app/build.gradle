plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nova.messenger'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nova.messenger'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0.0'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
