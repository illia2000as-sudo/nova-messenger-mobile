name: Build NOVA Messenger APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "mobile/**"
      - "src/**"
      - ".github/workflows/build-android.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Package NOVA web app into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www/mobile
          mkdir -p android/app/src/main/assets/www/src
          cp -R mobile/. android/app/src/main/assets/www/mobile/
          cp -R src/. android/app/src/main/assets/www/src/

      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Messenger-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
